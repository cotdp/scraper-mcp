version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
      python-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps-dev)
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 3
    groups:
      dashboard-security:
        applies-to: security-updates
        patterns: ["*"]
      dashboard-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps-dev)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 3
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-maintenance:
        patterns: ["*"]
    commit-message:
      prefix: ci(deps)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 3
    groups:
      images:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)
