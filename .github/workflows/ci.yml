name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies and all optional providers
        run: uv sync --locked --all-extras
      - name: Lint and check formatting
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Check types
        run: uv run --no-sync mypy src/ scripts/
      - name: Run isolated tests
        env:
          CACHE_DIR: ${{ runner.temp }}/scraper-mcp-tests
          PYTHON_DOTENV_DISABLED: "1"
          PERPLEXITY_API_KEY: ""
          OPENROUTER_API_KEY: ""
          SCRAPEOPS_API_KEY: ""
          SCRAPER_ADMIN_TOKEN: ""
          SCRAPER_ADMIN_ALLOWED_ORIGINS: ""
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          export NO_PROXY='*' no_proxy='*'
          uv run --no-sync pytest --cov-report=term-missing --cov-report=xml
      - name: Audit the locked dependency graph
        run: |
          uv export --locked --all-extras --no-emit-project --output-file "$RUNNER_TEMP/requirements-audit.txt"
          uv run --no-sync pip-audit --strict --disable-pip --require-hashes --progress-spinner off --requirement "$RUNNER_TEMP/requirements-audit.txt"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Check dashboard assets
        run: |
          bun install --frozen-lockfile
          bun run check
      - name: Build Python distributions
        run: uv build --no-sources
      - name: Upload Python distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
